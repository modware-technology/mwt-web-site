<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sayfa bulunamadı | ModWare Technology</title>
  <meta name="robots" content="noindex">

  <!-- Sekme ikonu -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f1c">

  <!-- Preloader yalnızca JS çalışıyorsa görünür. GSAP/animations.js
       5 sn içinde devralmazsa güvenlik zamanlayıcısı onu kaldırır. -->
  <script>
    document.documentElement.classList.add('is-loading');
    window.__preloaderSafety = setTimeout(function () {
      document.documentElement.classList.remove('is-loading');
    }, 5000);
  </script>

  <!-- Fontlar: Space Grotesk (başlıklar) + Inter (metin) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="/css/style.css?v=27">
</head>
<body data-page="404">

  <!-- ============ PRELOADER ============ -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-inner">
      <p class="preloader-word" data-preloader-word>MODWARE</p>
      <div class="preloader-bar"><span class="preloader-bar-fill"></span></div>
      <p class="preloader-count"><span data-preloader-count>0</span>%</p>
    </div>
  </div>

  <!-- ============ ARKA PLAN KATMANI (sabit, içeriğin arkasında) ============ -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-shade"></div>
    <div class="bg-noise"></div>
  </div>

  <!-- ============ ÖZEL İMLEÇ (yalnızca fareli cihazlarda) ============ -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor-frame"><i></i><i></i><i></i><i></i></div>
    <div class="cursor-dot"></div>
  </div>

  <!-- ============ KAYDIRMA İLERLEME ÇUBUĞU ============ -->
  <div class="scroll-progress" aria-hidden="true"><span class="scroll-progress-bar"></span></div>

  <!-- Klavye kullanıcıları için içeriğe atlama bağlantısı -->
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <!-- ============ ORTAK ÜST MENÜ ============
       Bu blok her sayfada aynıdır. Aktif sayfa,
       main.js tarafından <body data-page> değerine göre işaretlenir. -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="logo" href="/index.html" aria-label="ModWare Technology ana sayfa">
        <img src="/assets/logo/modware-logo-light.png" alt="ModWare" width="275" height="30">
      </a>

      <!-- Mobilde menüyü açıp kapatan buton -->
      <button class="nav-toggle" id="nav-toggle" type="button"
              aria-controls="site-nav" aria-expanded="false" aria-label="Menüyü aç">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Ana menü">
        <ul class="nav-list">
          <li><a class="nav-link" href="/index.html" data-nav="home">Ana Sayfa</a></li>
          <li><a class="nav-link" href="/hizmetler.html" data-nav="hizmetler">Hizmetler</a></li>
          <li><a class="nav-link" href="/urunler.html" data-nav="urunler">Ürünler</a></li>
          <li><a class="nav-link" href="/hakkimizda.html" data-nav="hakkimizda">Hakkımızda</a></li>
        </ul>
        <a class="btn btn-accent nav-cta" href="/teklif.html">Teklif Al</a>
      </nav>
    </div>
  </header>
  <!-- ============ /ORTAK ÜST MENÜ ============ -->

  <main id="main">
    <!-- Bulunamayan adresler için (Netlify 404.html'i otomatik kullanır) -->
    <section class="container page-placeholder not-found" aria-labelledby="nf-title">
      <p class="eyebrow" data-anim="hero">Hata 404</p>
      <h1 id="nf-title" data-split-intro>Bu sayfa devre dışı.</h1>
      <p data-anim="hero">Aradığınız sayfa taşınmış ya da kaldırılmış olabilir.</p>
      <div class="nf-actions" data-anim="hero">
        <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
        <a class="btn btn-ghost" href="/urunler.html">Ürünlere göz atın</a>
      </div>
    </section>
  </main>

  <!-- ============ ORTAK ALT BİLGİ ============ -->
  <footer class="site-footer">
    <!-- Footer üstündeki çizgi: sayfa sonuna yaklaşırken soldan sağa dolar -->
    <div class="footer-line" aria-hidden="true"><span class="footer-line-fill"></span></div>
    <div class="container footer-inner">
      <a class="logo logo-sm" href="/index.html"><img src="/assets/logo/modware-logo-light.png" alt="ModWare" width="275" height="30"></a>
      <p class="footer-meta"><span class="footer-location">İzmit, Kocaeli</span> <span class="footer-copy">© <span data-year>2026</span> ModWare Technology</span></p>
      <!-- İletişim ikonları: e-posta ve LinkedIn -->
      <div class="footer-contact">
        <a class="footer-icon" href="mailto:info@modwaretechnology.com" aria-label="E-posta gönderin: info@modwaretechnology.com" title="info@modwaretechnology.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg></a>
        <a class="footer-icon" href="https://www.linkedin.com/company/modware-technology1/" target="_blank" rel="noopener" aria-label="ModWare Technology LinkedIn sayfası (yeni sekmede açılır)" title="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002zM7 8.48H3V21h4V8.48zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91l.04-1.68z"/></svg></a>
      </div>
    </div>
  </footer>

  <!-- Yukarı çık: sayfa sonuna gelince belirir (main.js) -->
  <button class="to-top" id="to-top" type="button" aria-label="Sayfanın başına dön">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- Kütüphaneler (CDN, sabit sürüm). main.js ve animations.js'den önce yüklenmeli.
       GSAP + ScrollTrigger: animasyon · SplitType: harf bölme · Lenis: yumuşak kaydırma -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="/js/main.js?v=27" defer></script>
  <script src="/js/animations.js?v=27" defer></script>
</body>
</html>
